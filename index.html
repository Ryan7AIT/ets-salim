<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ets Bellal Salim </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">

        <section v-if="!isAuthenticated" class="login-screen">
            <div class="login-panel">
                <div class="login-brand">
                    <div>
                        <p class="login-kicker">Espace d'administration</p>
                        <h1>Ets Bellal Salim</h1>
                    </div>
                </div>
                <p class="login-copy">Connectez-vous pour gérer les clients, contrats et interventions.</p>

                <form class="login-form" @submit.prevent="login()">
                    <div class="form-group">
                        <label>Identifiant</label>
                        <input type="text" v-model="loginForm.username" placeholder="admin" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" v-model="loginForm.password" placeholder="admin" required>
                    </div>
                    <p class="login-hint">Identifiants de démonstration : admin / admin</p>
                    <p v-if="loginError" class="login-error">{{ loginError }}</p>
                    <button type="submit" class="primary-btn login-submit">Se connecter</button>
                </form>
            </div>
        </section>

        <template v-else>
            <!-- Sidebar -->
            <aside class="sidebar" :class="{ open: sidebarOpen }">
                <div class="sidebar-header">
                    <div class="logo">
                        <span>Ets Bellal Salim</span>
                    </div>
                    <button class="mobile-close" @click="sidebarOpen = false"><i class="fas fa-times"></i></button>
                </div>
                <nav class="sidebar-nav">
                    <ul>
                        <li :class="{ active: currentPage === 'dashboard' }" @click="navigate('dashboard')">
                            <a href="#"><i class="fas fa-th-large"></i> <span>Tableau de bord</span></a>
                        </li>
                        <li :class="{ active: currentPage === 'clients' }" @click="navigate('clients')">
                            <a href="#"><i class="fas fa-users"></i> <span>Clients</span></a>
                        </li>
                        <li :class="{ active: currentPage === 'contracts' }" @click="navigate('contracts')">
                            <a href="#"><i class="fas fa-file-contract"></i> <span>Contrats</span></a>
                        </li>
                        <li :class="{ active: currentPage === 'interventions' }" @click="navigate('interventions')">
                            <a href="#"><i class="fas fa-calendar-check"></i> <span>Interventions</span></a>
                        </li>
                        <li v-if="features.invoices" :class="{ active: currentPage === 'invoices' }" @click="navigate('invoices')">
                            <a href="#"><i class="fas fa-file-invoice"></i> <span>Factures</span></a>
                        </li>
                        <li v-if="features.stock" :class="{ active: currentPage === 'stock' }" @click="navigate('stock')">
                            <a href="#"><i class="fas fa-boxes"></i> <span>Stock</span></a>
                        </li>
                        <li :class="{ active: currentPage === 'parametres' }" @click="navigate('parametres')">
                            <a href="#"><i class="fas fa-cog"></i> <span>Paramètres</span></a>
                        </li>

                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-info">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=2563EB&color=fff" alt="Avatar">
                        <div>
                            <p class="user-name">Admin User</p>
                            <p class="user-role">Responsable Opérations</p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-wrapper">
                <!-- Top Navigation -->
                <header class="top-nav">
                    <div class="top-nav-left">
                        <button class="mobile-toggle" @click="sidebarOpen = true"><i class="fas fa-bars"></i></button>
                        <h1>{{ pageTitle }}</h1>
                    </div>
                    <div class="top-nav-right">
                        <div class="notification-menu" @click.stop>
                            <button class="icon-btn notification-trigger" @click="toggleNotifications()">
                                <i class="far fa-bell"></i>
                                <span v-if="unreadNotificationsCount" class="notif-dot"></span>
                            </button>
                            <div v-if="notificationsOpen" class="notification-panel">
                                <div class="notification-header">
                                    <div>
                                        <h3>Notifications</h3>
                                        <p>{{ unreadNotificationsCount }} non lue(s)</p>
                                    </div>
                                    <button class="text-btn" @click="markAllNotificationsRead()"
                                        :disabled="!unreadNotificationsCount">
                                        Tout lire
                                    </button>
                                </div>
                                <div class="notification-list">
                                    <div v-for="notification in notifications" :key="notification.id"
                                        class="notification-item" :class="{ unread: !notification.read }">
                                        <div>
                                            <p class="notification-title">{{ notification.title }}</p>
                                            <p class="notification-text">{{ notification.message }}</p>
                                            <span class="notification-time">{{ notification.time }}</span>
                                        </div>
                                        <button class="text-btn" @click="markNotificationRead(notification.id)"
                                            :disabled="notification.read">
                                            {{ notification.read ? 'Lu' : 'Marquer lu' }}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button class="secondary-btn top-logout" @click="logout()">
                            Déconnexion
                        </button>
                    </div>
                </header>

                <!-- Content Area -->
                <div class="content-container">

                    <!-- Tableau de bord -->
                    <section class="page" :class="{ active: currentPage === 'dashboard' }">
                        <div class="stats-grid">
                            <div class="stat-card" v-for="stat in dashboardStats" :key="stat.label">
                                <div class="stat-icon" :class="stat.color"><i :class="stat.icon"></i></div>
                                <div class="stat-details">
                                    <p class="stat-label">{{ stat.label }}</p>
                                    <h3 class="stat-value">{{ stat.value }}</h3>
                                </div>
                            </div>
                        </div>

                        <div class="dashboard-charts">
                            <div class="chart-container card">
                                <h3>Interventions Mensuelles</h3>
                                <canvas id="interventionsChart"></canvas>
                            </div>
                            <div class="chart-container card">
                                <h3>Répartition des Contrats</h3>
                                <canvas id="statusChart"></canvas>
                            </div>
                        </div>

                        <div class="dashboard-bottom-grid">
                            <div class="card table-card">
                                <div class="card-header">
                                    <h3>Prochaines Interventions</h3>
                                    <button class="text-btn" @click="navigate('interventions')">Voir tout</button>
                                </div>
                                <div class="table-responsive">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Client</th>
                                                <th>Date</th>
                                                <th>Statut</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="i in interventions.slice(0, 4)" :key="i.id">
                                                <td>{{ i.client }}</td>
                                                <td>{{ i.date }}</td>
                                                <td><span class="badge" :class="statusClass(i.status)">{{ i.status
                                                        }}</span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="card activity-card">
                                <div class="card-header">
                                    <h3>Actions Rapides</h3>
                                </div>
                                <div class="quick-actions-list">
                                    <button class="action-item" @click="openClientModal()">
                                        <i class="fas fa-user-plus"></i> Ajouter un Client
                                    </button>
                                    <button class="action-item" @click="openContractModal()">
                                        <i class="fas fa-file-circle-plus"></i> Créer un Contrat
                                    </button>
                                    <button class="action-item" @click="openInterventionModal()">
                                        <i class="fas fa-calendar-plus"></i> Planifier une Intervention
                                    </button>
                                    <button v-if="features.invoices" class="action-item" @click="openInvoiceModal()">
                                        <i class="fas fa-file-invoice-dollar"></i> Créer une Facture
                                    </button>
                                    <button v-if="features.stock" class="action-item" @click="navigate('stock'); openStockProductModal()">
                                        <i class="fas fa-box-open"></i> Ajouter un Produit
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Clients -->
                    <section class="page" :class="{ active: currentPage === 'clients' }">
                        <div class="card">
                            <div class="table-controls">
                                <div class="search-bar">
                                    <input type="text" v-model="clientSearch"
                                        placeholder="Filtrer par société ou contact...">
                                </div>
                                <button class="primary-btn" @click="openClientModal()">
                                    <i class="fas fa-plus"></i> Ajouter un Client
                                </button>
                            </div>
                            <div class="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Société</th>
                                            <th>Contact</th>
                                            <th>Tél / Email</th>
                                            <th>Adresse</th>
                                            <th>Contrats</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="c in filteredClients" :key="c.id">
                                            <td><strong>{{ c.company }}</strong></td>
                                            <td>{{ c.contact }}</td>
                                            <td>
                                                <div style="font-size:0.85rem">{{ c.phone }}</div>
                                                <div style="font-size:0.8rem;color:var(--text-muted)">{{ c.email }}
                                                </div>
                                            </td>
                                            <td>{{ c.address }}</td>
                                            <td><span class="badge badge-active">{{ clientContractCount(c.company) }}
                                                    Actifs</span></td>
                                            <td>
                                                <button class="icon-btn" title="Modifier" @click="startEditClient(c)"><i
                                                        class="far fa-edit"></i></button>
                                                <button class="icon-btn" title="Supprimer" style="color:var(--danger)"
                                                    @click="deleteClient(c.id)">
                                                    <i class="far fa-trash-alt"></i>
                                                </button>
                                            </td>
                                        </tr>
                                        <tr v-if="filteredClients.length === 0">
                                            <td colspan="6"
                                                style="text-align:center;color:var(--text-muted);padding:32px">
                                                Aucun client trouvé.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>

                    <!-- Contrats -->
                    <section class="page" :class="{ active: currentPage === 'contracts' }">
                        <div class="card">
                            <div class="table-controls">
                                <div class="search-bar">
                                    <input type="text" v-model="contractSearch"
                                        placeholder="Rechercher des contrats...">
                                </div>
                                <button class="primary-btn" @click="openContractModal()">
                                    <i class="fas fa-plus"></i> Nouveau Contrat
                                </button>
                            </div>
                            <div class="contracts-grid">
                                <div class="contract-card card" v-for="c in filteredContracts" :key="c.id">
                                    <div style="display:flex;justify-content:space-between;align-items:start">
                                        <h4>{{ c.name }}</h4>
                                        <span class="badge" :class="statusClass(c.status)">{{ c.status }}</span>
                                    </div>
                                    <p style="color:var(--text-muted);font-size:0.85rem;margin:8px 0">{{ c.client }}</p>
                                    <div class="progress-container">
                                        <div class="progress-bar"
                                            :style="{ width: contractCompletionPercent(c) + '%' }"></div>
                                    </div>
                                    <div style="display:flex;justify-content:space-between;font-size:0.8rem">
                                        <span>{{ contractCompletedCount(c) }} / {{ contractInterventionTotal(c) }}
                                            Interventions</span>
                                        <span>{{ contractCompletionPercent(c) }}%</span>
                                    </div>
                                    <div class="contract-card-footer">
                                        <span style="font-size:0.75rem">Expire : {{ c.end }}</span>
                                        <div class="inline-actions">
                                            <button class="text-btn" @click="openContractDetails(c)">Détails</button>
                                            <button class="icon-btn" title="Modifier" @click="startEditContract(c)"><i
                                                    class="far fa-edit"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div v-if="filteredContracts.length === 0"
                                    style="padding:32px;text-align:center;color:var(--text-muted)">
                                    Aucun contrat trouvé.
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Interventions -->
                    <section class="page" :class="{ active: currentPage === 'interventions' }">
                        <div class="view-toggle card">
                            <button class="primary-btn" @click="openInterventionModal()">
                                <i class="fas fa-plus"></i> Planifier
                            </button>
                        </div>

                        <div class="card" v-show="interventionView === 'list'">
                            <div class="table-controls intervention-filters">
                                <div class="intervention-filters-fields">
                                    <div class="form-group filter-field filter-field-client">
                                        <label>Client</label>
                                        <input type="search" v-model="interventionFilterClient"
                                            placeholder="Rechercher un client..." list="intervention-client-options"
                                            autocomplete="off">
                                        <datalist id="intervention-client-options">
                                            <option v-for="client in clients" :key="client.id" :value="client.company">
                                            </option>
                                        </datalist>
                                    </div>
                                    <div class="form-group filter-field">
                                        <label>Type</label>
                                        <select v-model="interventionFilterType">
                                            <option value="">Tous les types</option>
                                            <option v-for="option in interventionTypeOptions()" :key="option.value"
                                                :value="option.value">{{ option.label }}</option>
                                        </select>
                                    </div>
                                    <div class="form-group filter-field">
                                        <label>Du</label>
                                        <input type="date" v-model="interventionFilterStart">
                                    </div>
                                    <div class="form-group filter-field">
                                        <label>Au</label>
                                        <input type="date" v-model="interventionFilterEnd">
                                    </div>
                                </div>
                                <p class="filter-summary">
                                    {{ filteredInterventions.length }} résultat(s)
                                    <span v-if="filteredInterventions.length">
                                        — affichage {{ interventionPaginationFrom }}-{{ interventionPaginationTo }}
                                    </span>
                                </p>
                            </div>
                            <div class="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Type</th>
                                            <th>Client</th>
                                            <th>Date</th>
                                            <th>Priorité</th>
                                            <th>Statut</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="i in paginatedInterventions" :key="i.id"
                                            :class="interventionTypeRowClass(i.type)">
                                            <td>#{{ i.id }}</td>
                                            <td>
                                                <span class="intervention-type-badge"
                                                    :class="interventionTypeRowClass(i.type)">
                                                    {{ interventionTypeLabel(i.type) }}
                                                </span>
                                            </td>
                                            <td>{{ i.client }}</td>
                                            <td>{{ i.date }}</td>
                                            <td><span :style="{ color: priorityColor(i.priority) }">{{ i.priority
                                                    }}</span>
                                            </td>
                                            <td>
                                                <select class="status-select" :value="i.status"
                                                    @change="updateInterventionStatus(i.id, $event.target.value)">
                                                    <option v-for="status in interventionStatusOptions()" :key="status"
                                                        :value="status">{{ status }}</option>
                                                </select>
                                            </td>
                                            <td>
                                                <button class="icon-btn" title="Modifier"
                                                    @click="startEditIntervention(i)">
                                                    <i class="far fa-edit"></i>
                                                </button>
                                                <button class="icon-btn" title="Supprimer" style="color:var(--danger)"
                                                    @click="deleteIntervention(i.id)">
                                                    <i class="far fa-trash-alt"></i>
                                                </button>
                                            </td>
                                        </tr>
                                        <tr v-if="paginatedInterventions.length === 0">
                                            <td colspan="7"
                                                style="text-align:center;color:var(--text-muted);padding:32px">
                                                Aucune intervention pour ces filtres.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="pagination-bar" v-if="filteredInterventions.length">
                                <button type="button" class="secondary-btn" :disabled="interventionPage <= 1"
                                    @click="setInterventionPage(interventionPage - 1)">
                                    Précédent
                                </button>
                                <span class="pagination-info">Page {{ interventionPage }} / {{ interventionTotalPages }}</span>
                                <button type="button" class="secondary-btn"
                                    :disabled="interventionPage >= interventionTotalPages"
                                    @click="setInterventionPage(interventionPage + 1)">
                                    Suivant
                                </button>
                            </div>
                        </div>
                    </section>

                    <!-- Factures -->
                    <section v-if="features.invoices" class="page" :class="{ active: currentPage === 'invoices' }">
                        <div class="card">
                            <div class="table-controls">
                                <div class="search-bar">
                                    <input type="text" v-model="invoiceSearch"
                                        placeholder="Rechercher par numéro, client ou statut...">
                                </div>
                                <button class="primary-btn" @click="openInvoiceModal()">
                                    <i class="fas fa-plus"></i> Nouveau document
                                </button>
                            </div>
                            <div class="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>N°</th>
                                            <th>Type</th>
                                            <th>Client</th>
                                            <th>Émission</th>
                                            <th>Échéance</th>
                                            <th>Statut</th>
                                            <th>Total</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="invoice in filteredInvoices" :key="invoice.id">
                                            <td><strong>{{ invoice.number }}</strong></td>
                                            <td>{{ invoiceDocumentTypeLabel(invoice.documentType) }}</td>
                                            <td>{{ invoice.client?.company || '—' }}</td>
                                            <td>{{ formatInvoiceDate(invoice.issueDate) }}</td>
                                            <td>{{ invoice.documentType === 'proforma' ? '—' : formatInvoiceDate(invoice.dueDate) }}</td>
                                            <td>
                                                <span class="badge" :class="invoiceStatusClass(invoice.status)">
                                                    {{ invoiceStatusLabel(invoice.status) }}
                                                </span>
                                            </td>
                                            <td>{{ formatInvoiceMoney(invoice.totals?.total, invoice.currency) }}</td>
                                            <td>
                                                <div class="inline-actions">
                                                    <button class="icon-btn" title="Aperçu" @click="openInvoicePreview(invoice)">
                                                        <i class="far fa-eye"></i>
                                                    </button>
                                                    <button class="icon-btn" title="PDF" @click="exportInvoice(invoice.id, 'pdf')">
                                                        <i class="far fa-file-pdf"></i>
                                                    </button>
                                                    <button class="icon-btn" title="Excel" @click="exportInvoice(invoice.id, 'xlsx')">
                                                        <i class="far fa-file-excel"></i>
                                                    </button>
                                                    <button class="icon-btn" title="Modifier" @click="startEditInvoice(invoice)">
                                                        <i class="far fa-edit"></i>
                                                    </button>
                                                    <button class="icon-btn" title="Supprimer" style="color:var(--danger)"
                                                        @click="deleteInvoice(invoice.id)">
                                                        <i class="far fa-trash-alt"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr v-if="filteredInvoices.length === 0">
                                            <td colspan="8"
                                                style="text-align:center;color:var(--text-muted);padding:32px">
                                                Aucune facture trouvée.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>

                    <!-- Stock -->
                    <section v-if="features.stock" class="page" :class="{ active: currentPage === 'stock' }">
                        <div class="stock-kpi-grid">
                            <div class="card stock-kpi-card">
                                <div class="stock-kpi-icon blue"><i class="fas fa-boxes"></i></div>
                                <div class="stock-kpi-content">
                                    <p>Articles</p>
                                    <h2>{{ stockSummary.totalProducts }}</h2>
                                </div>
                            </div>
                            <div class="card stock-kpi-card" :class="{ 'stock-kpi-card-alert': stockSummary.lowStockCount > 0 }">
                                <div class="stock-kpi-icon orange"><i class="fas fa-triangle-exclamation"></i></div>
                                <div class="stock-kpi-content">
                                    <p>Stock bas</p>
                                    <h2 :class="{ 'stock-kpi-alert': stockSummary.lowStockCount > 0 }">{{ stockSummary.lowStockCount }}</h2>
                                </div>
                            </div>
                            <div class="card stock-kpi-card">
                                <div class="stock-kpi-icon green"><i class="fas fa-coins"></i></div>
                                <div class="stock-kpi-content">
                                    <p>Valeur du stock</p>
                                    <h2>{{ formatStockMoney(stockSummary.totalStockValue) }}</h2>
                                </div>
                            </div>
                        </div>

                        <div class="card stock-main-card">
                            <div class="stock-tabs">
                                <button type="button" class="stock-tab" :class="{ active: stockTab === 'products' }"
                                    @click="stockTab = 'products'">
                                    <i class="fas fa-box"></i> Produits
                                </button>
                                <button type="button" class="stock-tab" :class="{ active: stockTab === 'movements' }"
                                    @click="stockTab = 'movements'">
                                    <i class="fas fa-right-left"></i> Mouvements
                                </button>
                            </div>

                            <div v-if="stockTab === 'products'" class="stock-tab-panel">
                                <div class="table-controls">
                                    <div class="search-bar stock-search-row">
                                        <input type="text" v-model="stockSearch"
                                            placeholder="Rechercher par nom ou référence...">
                                        <label class="checkbox-chip stock-filter-chip">
                                            <input type="checkbox" v-model="stockLowStockOnly">
                                            Stock bas uniquement
                                        </label>
                                    </div>
                                    <button class="primary-btn" @click="openStockProductModal()">
                                        <i class="fas fa-plus"></i> Nouveau produit
                                    </button>
                                </div>
                                <p class="stock-table-hint">
                                    <i class="fas fa-mouse"></i> Double-cliquez sur un produit pour voir son historique
                                </p>
                                <div class="table-responsive">
                                    <table class="stock-products-table">
                                        <thead>
                                            <tr>
                                                <th>Photo</th>
                                                <th>Produit</th>
                                                <th>Référence</th>
                                                <th>Qté</th>
                                                <th>Prix achat</th>
                                                <th>Prix vente</th>
                                                <th>Valeur</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="product in filteredStockProducts" :key="product.id"
                                                class="stock-product-row"
                                                :class="{ 'stock-row-low': product.isLowStock }"
                                                @dblclick="openStockProductDetail(product)">
                                                <td>
                                                    <div class="stock-thumb">
                                                        <img v-if="product.picture" :src="product.picture" :alt="product.name">
                                                        <i v-else class="fas fa-box"></i>
                                                    </div>
                                                </td>
                                                <td>
                                                    <strong>{{ product.name }}</strong>
                                                    <span v-if="product.isLowStock" class="stock-low-tag">Stock bas</span>
                                                </td>
                                                <td><span class="stock-ref">{{ product.reference || '—' }}</span></td>
                                                <td>
                                                    <span class="badge stock-qty-badge" :class="product.isLowStock ? 'badge-danger' : 'badge-active'">
                                                        {{ product.quantity }}
                                                    </span>
                                                </td>
                                                <td>{{ formatStockMoney(product.buyPrice) }}</td>
                                                <td>{{ formatStockMoney(product.salePrice) }}</td>

                    </div>
                </div>

                <div v-if="invoiceForm.documentType === 'proforma' && selectedInvoiceClient" class="proforma-client-panel">
                    <div class="proforma-client-panel-header">
                        <i class="fas fa-building"></i>
                        <span>Client sur le proforma</span>
                    </div>
                    <div class="proforma-client-panel-body">
                        <div class="proforma-client-field">
                            <span class="proforma-client-field-label">Raison sociale</span>
                            <strong class="proforma-client-company">{{ selectedInvoiceClient.company }}</strong>
                        </div>
                        <div class="form-group proforma-client-nif-field">
                            <label>NIF</label>
                            <input type="text" v-model="invoiceForm.clientNif"
                                placeholder="Numéro d'identification fiscale du client">
                        </div>
                    </div>
                </div>

                <div class="invoice-lines-block">
                    <div class="card-header">
                        <h4>Lignes de facture</h4>
                        <button type="button" class="text-btn" @click="addInvoiceLine()">+ Ajouter une ligne</button>
                    </div>
                    <div class="table-responsive">
                        <table class="invoice-lines-table">
                            <thead>
                                <tr>
                                    <th>Description</th>
                                    <th>Qté</th>
                                    <th>Prix unitaire</th>
                                    <th>Montant</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="(item, index) in invoiceForm.items" :key="index">
                                    <td><input type="text" v-model="item.description" required></td>
                                    <td><input type="number" min="0" step="0.01" v-model.number="item.quantity"></td>
                                    <td><input type="number" min="0" step="0.01" v-model.number="item.unitPrice"></td>
                                    <td class="amount-cell">{{ formatInvoiceMoney(invoiceLineAmount(item), invoiceForm.currency) }}</td>
                                    <td>
                                        <button type="button" class="icon-btn" :disabled="invoiceForm.items.length <= 1"
                                            @click="removeInvoiceLine(index)">
                                            <i class="far fa-trash-alt"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ajustement</label>
                        <input type="number" step="0.01" v-model.number="invoiceForm.adjustment">
                    </div>
                    <div class="form-group">
                        <label>Remise</label>
                        <input type="number" min="0" step="0.01" v-model.number="invoiceForm.discountAmount">
                    </div>
                    <div class="form-group">
                        <label>TVA (%)</label>
                        <input type="number" min="0" step="0.01" v-model.number="invoiceForm.taxRate">
                    </div>
                    <div class="form-group">
                        <label>Devise</label>
                        <select v-model="invoiceForm.currency">
                            <option value="DZD">DZD</option>
                            <option value="EUR">EUR</option>
                            <option value="USD">USD</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea rows="2" v-model="invoiceForm.notes" placeholder="Notes affichées sur la facture..."></textarea>
                </div>

                <div class="form-group invoice-cachet-option">
                    <label class="checkbox-chip">
                        <input type="checkbox" v-model="invoiceForm.includeCachet" :disabled="!invoiceSettings.cachetImage">
                        Inclure le cachet (sous le total, en bas à droite)
                    </label>
                    <p v-if="!invoiceSettings.cachetImage" class="field-hint">
                        Importez votre cachet dans Paramètres → Facturation pour l'utiliser sur vos documents.
                    </p>
                </div>

                <div class="invoice-totals-summary">
                    <div><span>Sous-total</span><strong>{{ formatInvoiceMoney(invoiceFormTotals.subtotal, invoiceForm.currency) }}</strong></div>
                    <div><span>Ajustements</span><strong>{{ formatInvoiceMoney(invoiceFormTotals.adjustment, invoiceForm.currency) }}</strong></div>
                    <div><span>Remise</span><strong>-{{ formatInvoiceMoney(invoiceFormTotals.discount, invoiceForm.currency) }}</strong></div>
                    <div><span>Sous-total ajusté</span><strong>{{ formatInvoiceMoney(invoiceFormTotals.taxableSubtotal, invoiceForm.currency) }}</strong></div>
                    <div><span>TVA</span><strong>{{ formatInvoiceMoney(invoiceFormTotals.tax, invoiceForm.currency) }}</strong></div>
                    <div class="invoice-total-row"><span>Total</span><strong>{{ formatInvoiceMoney(invoiceFormTotals.total, invoiceForm.currency) }}</strong></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="secondary-btn" @click="requestCloseModal()">Annuler</button>
                    <button type="submit" class="primary-btn">{{ editingInvoiceId ? 'Mettre à jour' : 'Créer' }}</button>
                </div>
            </form>
        </div>

        <!-- Modal Produit Stock -->
        <div class="modal" v-show="activeModal === 'stockProductModal'">
            <div class="modal-header">
                <h3>{{ editingStockProductId ? 'Modifier le produit' : 'Nouveau produit' }}</h3>
                <button class="close-modal" @click="requestCloseModal()">&times;</button>
            </div>
            <form class="modal-body" @submit.prevent="submitStockProduct()">
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" v-model="stockProductForm.name" required placeholder="Ex. Raccord cuivre 15 mm">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Référence</label>
                        <input type="text" v-model="stockProductForm.reference" placeholder="SKU / référence fournisseur">
                    </div>
                    <div class="form-group" v-if="!editingStockProductId">
                        <label>Quantité initiale</label>
                        <input type="number" min="0" step="0.01" v-model.number="stockProductForm.initialQuantity">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Prix d'achat</label>
                        <input type="number" min="0" step="0.01" v-model.number="stockProductForm.buyPrice">
                    </div>
                    <div class="form-group">
                        <label>Prix de vente</label>
                        <input type="number" min="0" step="0.01" v-model.number="stockProductForm.salePrice">
                    </div>
                    <div class="form-group">
                        <label>Seuil stock bas</label>
                        <input type="number" min="0" step="0.01" v-model.number="stockProductForm.lowStockThreshold">
                    </div>
                </div>
                <div class="form-group">
                    <label>Photo (optionnelle)</label>
                    <input type="file" accept="image/*" @change="onStockProductPictureChange($event)">
                    <div v-if="stockProductForm.picture" class="stock-picture-preview">
                        <img :src="stockProductForm.picture" alt="Aperçu produit">
                        <button type="button" class="secondary-btn" @click="removeStockProductPicture()">Supprimer</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea rows="2" v-model="stockProductForm.notes" placeholder="Remarques..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="secondary-btn" @click="requestCloseModal()">Annuler</button>
                    <button type="submit" class="primary-btn">{{ editingStockProductId ? 'Mettre à jour' : 'Créer' }}</button>
                </div>
            </form>
        </div>

        <!-- Modal Mouvement Stock -->
        <div class="modal" v-show="activeModal === 'stockMovementModal'">
            <div class="modal-header">
                <h3>Nouveau mouvement</h3>
                <button class="close-modal" @click="requestCloseModal()">&times;</button>
            </div>
            <form class="modal-body" @submit.prevent="submitStockMovement()">
                <div class="form-group">
                    <label>Produit</label>
                    <select v-model="stockMovementForm.productId" required>
                        <option value="" disabled>Sélectionner un produit</option>
                        <option v-for="product in stockProducts" :key="product.id" :value="product.id">
                            {{ product.name }} ({{ product.quantity }})
                        </option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Type</label>
                        <select v-model="stockMovementForm.type">
                            <option value="in">Entrée</option>
                            <option value="out">Sortie</option>
                            <option value="adjustment">Ajustement</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" v-model="stockMovementForm.movementDate" required>
                    </div>
                </div>
                <div class="form-row" v-if="stockMovementForm.type !== 'adjustment'">
                    <div class="form-group">
                        <label>Quantité</label>
                        <input type="number" min="0.01" step="0.01" v-model.number="stockMovementForm.quantity" required>
                    </div>
                    <div class="form-group">
                        <label>Prix unitaire</label>
                        <input type="number" min="0" step="0.01" v-model.number="stockMovementForm.unitPrice">
                    </div>
                </div>
                <div class="form-group" v-else>
                    <label>Nouvelle quantité</label>
                    <input type="number" min="0" step="0.01" v-model.number="stockMovementForm.newQuantity" required>
                    <p v-if="selectedStockMovementProduct" class="field-hint">
                        Stock actuel : {{ selectedStockMovementProduct.quantity }}
                    </p>
                </div>
                <div class="form-group">
                    <label>Motif</label>
                    <textarea rows="2" v-model="stockMovementForm.reason"
                        placeholder="Ex. Achat quincaillerie, intervention client..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="secondary-btn" @click="requestCloseModal()">Annuler</button>
                    <button type="submit" class="primary-btn">Enregistrer</button>
                </div>
            </form>
        </div>

        <!-- Modal Détail Produit Stock -->
        <div class="modal modal-wide stock-detail-modal" v-if="activeModal === 'stockProductDetailModal' && stockProductDetail">
            <div class="modal-header">
                <div>
                    <h3>{{ stockProductDetail.name }}</h3>
                    <p v-if="stockProductDetail.reference" class="modal-subtitle">Réf. {{ stockProductDetail.reference }}</p>
                </div>
                <button class="close-modal" @click="closeModal()">&times;</button>
            </div>
            <div class="modal-body stock-detail-body">
                <div class="stock-detail-summary">
                    <div class="stock-detail-photo">
                        <img v-if="stockProductDetail.picture" :src="stockProductDetail.picture" :alt="stockProductDetail.name">
                        <i v-else class="fas fa-box"></i>
                    </div>
                    <div class="stock-detail-stats">
                        <div class="stock-detail-stat">
                            <span>Quantité</span>
                            <strong :class="{ 'stock-kpi-alert': stockProductDetail.isLowStock }">
                                {{ stockProductDetail.quantity }}
                            </strong>
                        </div>
                        <div class="stock-detail-stat">
                            <span>Prix achat</span>
                            <strong>{{ formatStockMoney(stockProductDetail.buyPrice) }}</strong>
                        </div>
                        <div class="stock-detail-stat">
                            <span>Prix vente</span>
                            <strong>{{ formatStockMoney(stockProductDetail.salePrice) }}</strong>
                        </div>
                        <div class="stock-detail-stat">
                            <span>Valeur stock</span>
                            <strong>{{ formatStockMoney(stockProductDetail.stockValue) }}</strong>
                        </div>
                    </div>
                </div>
                <p v-if="stockProductDetail.notes" class="stock-detail-notes">{{ stockProductDetail.notes }}</p>

                <div class="stock-detail-movements">
                    <div class="card-header">
                        <h4><i class="fas fa-clock-rotate-left"></i> Historique des mouvements</h4>
                    </div>
                    <div v-if="stockProductDetailLoading" class="stock-detail-loading">
                        <i class="fas fa-spinner fa-spin"></i> Chargement...
                    </div>
                    <div v-else class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Qté</th>
                                    <th>Prix unitaire</th>
                                    <th>Motif</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="movement in stockProductDetailMovements" :key="movement.id">
                                    <td>{{ formatStockDate(movement.movementDate) }}</td>
                                    <td>
                                        <span class="badge stock-movement-badge"
                                            :class="stockMovementTypeClass(movement.type)">
                                            {{ stockMovementTypeLabel(movement.type) }}
                                        </span>
                                    </td>
                                    <td>{{ movement.quantity }}</td>
                                    <td>{{ formatStockMoney(movement.unitPrice) }}</td>
                                    <td>{{ movement.reason || '—' }}</td>
                                </tr>
                                <tr v-if="!stockProductDetailMovements.length">
                                    <td colspan="5" class="stock-empty-cell">Aucun mouvement pour ce produit.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="secondary-btn" @click="openStockMovementFromDetail()">
                    <i class="fas fa-right-left"></i> Nouveau mouvement
                </button>
                <button type="button" class="secondary-btn" @click="editStockProductFromDetail()">
                    <i class="far fa-edit"></i> Modifier
                </button>
                <button type="button" class="primary-btn" @click="closeModal()">Fermer</button>
            </div>
        </div>

        <!-- Modal Aperçu Facture -->
        <div class="modal modal-wide invoice-preview-modal" v-if="activeModal === 'invoicePreviewModal' && previewInvoice">
            <div class="modal-header">
                <div>
                    <h3>{{ previewDocumentTitle }} {{ previewInvoice.number }}</h3>
                    <p class="modal-subtitle">{{ previewInvoice.client?.company }}</p>
                </div>
                <button class="close-modal" @click="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="invoice-document">
                    <div class="invoice-doc-header">
                        <div class="invoice-doc-brand">
                            <div class="invoice-doc-logo">
                                <img v-if="invoiceSettings.logoMode === 'image' && invoiceSettings.logoImage"
                                    :src="invoiceSettings.logoImage" alt="Logo">
                                <span v-else class="invoice-logo-text">{{ invoiceSettings.logoText || invoiceSettings.companyName }}</span>
                            </div>
                        </div>
                        <div class="invoice-doc-meta">
                                <p class="invoice-meta-number">
                                    <strong>{{ invoiceText.invoiceNumber }}</strong> {{ previewInvoice.number }}
                                </p>
                                <p class="invoice-meta-dates">
                                    <span><strong>{{ invoiceText.issueDate }}</strong> {{ formatInvoiceDate(previewInvoice.issueDate) }}</span>
                                    <template v-if="previewInvoice.documentType !== 'proforma'">
                                        <span class="invoice-meta-sep">|</span>
                                        <span><strong>{{ invoiceText.dueDate }}</strong> {{ formatInvoiceDate(previewInvoice.dueDate) }}</span>
                                    </template>
                                </p>
                            </div>
                    </div>
                    <div class="invoice-doc-addresses">
                        <div>
                            <p class="address-label">{{ invoiceText.seller }}</p>
                            <p>{{ invoiceSettings.companyName }}</p>
                            <p>{{ invoiceSettings.contactName }}</p>
                            <p>{{ invoiceSettings.address }}</p>
                            <p>{{ invoiceSettings.email }}</p>
                            <p>{{ invoiceSettings.phone }}</p>
                            <p v-if="invoiceSettings.nif">{{ invoiceText.nif }} {{ invoiceSettings.nif }}</p>
                            <p v-if="invoiceSettings.registrationNumber">
                                {{ invoiceText.registrationNumber }} {{ invoiceSettings.registrationNumber }}
                            </p>
                            <p v-if="invoiceSettings.rip">{{ invoiceText.rip }} {{ invoiceSettings.rip }}</p>
                        </div>
                        <div v-if="previewInvoice.documentType === 'proforma'">
                            <p class="address-label">{{ invoiceText.client }}</p>
                            <p><strong>{{ previewInvoice.client?.company }}</strong></p>
                            <p v-if="previewInvoice.client?.nif">{{ invoiceText.nif }} {{ previewInvoice.client.nif }}</p>
                        </div>
                        <div v-else>
                            <p class="address-label">{{ invoiceText.billTo }}</p>
                            <p>C{{ String(previewInvoice.client?.id || '').padStart(3, '0') }} - {{ previewInvoice.client?.company }}</p>
                            <p>{{ previewInvoice.client?.contact }}</p>
                            <p>{{ previewInvoice.client?.address }}</p>
                            <p>{{ previewInvoice.client?.email }}</p>
                            <p v-if="previewInvoice.client?.nif">{{ invoiceText.nif }} {{ previewInvoice.client.nif }}</p>
                        </div>
                    </div>
                    <table class="invoice-doc-table">
                        <thead>
                            <tr>
                                <th>{{ invoiceText.description }}</th>
                                <th>{{ invoiceText.quantity }}</th>
                                <th>{{ invoiceText.unitPrice }}</th>
                                <th>{{ invoiceText.amount }}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(item, index) in previewInvoice.items" :key="index">
                                <td>{{ item.description }}</td>
                                <td class="num">{{ item.quantity }}</td>
                                <td class="num">{{ formatInvoiceMoney(item.unitPrice, previewInvoice.currency) }}</td>
                                <td class="num">{{ formatInvoiceMoney(item.amount, previewInvoice.currency) }}</td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="invoice-doc-footer">
                        <div class="invoice-doc-notes">
                            <p><strong>{{ invoiceText.notes }}</strong></p>
                            <p>{{ previewInvoice.notes || invoiceSettings.footerNotes || '—' }}</p>
                        </div>
                        <div class="invoice-doc-totals-wrap">
                            <div class="invoice-doc-totals">
                                <div><span>{{ invoiceText.subtotal }}</span><strong>{{ formatInvoiceMoney(previewInvoice.totals?.subtotal, previewInvoice.currency) }}</strong></div>
                                <div><span>{{ invoiceText.adjustments }}</span><strong>{{ formatInvoiceMoney(previewInvoice.totals?.adjustment, previewInvoice.currency) }}</strong></div>
                                <div><span>{{ invoiceText.discount }}</span><strong>-{{ formatInvoiceMoney(previewInvoice.totals?.discount, previewInvoice.currency) }}</strong></div>
                                <div><span>{{ invoiceText.adjustedSubtotal }}</span><strong>{{ formatInvoiceMoney(previewInvoice.totals?.taxableSubtotal, previewInvoice.currency) }}</strong></div>
                                <div><span>{{ invoiceText.tax }} ({{ previewInvoice.taxRate }}%)</span><strong>{{ formatInvoiceMoney(previewInvoice.totals?.tax, previewInvoice.currency) }}</strong></div>
                                <div class="total-row"><span>{{ invoiceText.total }}</span><strong>{{ formatInvoiceMoney(previewInvoice.totals?.total, previewInvoice.currency) }}</strong></div>
                            </div>
                            <img v-if="previewInvoice.includeCachet && invoiceSettings.cachetImage"
                                class="invoice-doc-cachet" :src="invoiceSettings.cachetImage" alt="Cachet">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="secondary-btn" @click="exportInvoice(previewInvoice.id, 'pdf')">
                    <i class="far fa-file-pdf"></i> PDF
                </button>
                <button type="button" class="secondary-btn" @click="exportInvoice(previewInvoice.id, 'xlsx')">
                    <i class="far fa-file-excel"></i> Excel
                </button>
                <button type="button" class="primary-btn" @click="startEditInvoice(previewInvoice)">Modifier</button>
            </div>
        </div>

    </div><!-- /modal-overlay -->

    <!-- Confirmation fermeture formulaire -->
    <div class="confirm-overlay" v-if="showCloseConfirm" @click.self="cancelDiscardChanges()">
        <div class="modal confirm-modal" @click.stop>
            <div class="modal-header">
                <h3>Fermer sans enregistrer ?</h3>
            </div>
            <p class="confirm-message">Vous avez des modifications non enregistrées. Voulez-vous vraiment fermer ce formulaire ?</p>
            <div class="modal-footer">
                <button type="button" class="secondary-btn" @click="cancelDiscardChanges()">Continuer l'édition</button>
                <button type="button" class="primary-btn danger-btn" @click="confirmDiscardChanges()">Fermer sans enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" :class="{ show: toastVisible }">{{ toastMessage }}</div>

    </template>

    </div><!-- /app -->

    <script src="script.js"></script>
</body>

</html>
