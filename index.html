<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ets Bellal Salim </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">

        <section v-if="!isAuthenticated" class="login-screen">
            <div class="login-panel">
                <div class="login-brand">
                    <div>
                        <p class="login-kicker">Espace d'administration</p>
                        <h1>Ets Bellal Salim</h1>
                    </div>
                </div>
                <p class="login-copy">Connectez-vous pour gérer les clients, contrats et interventions.</p>

                <form class="login-form" @submit.prevent="login()">
                    <div class="form-group">
                        <label>Identifiant</label>
                        <input type="text" v-model="loginForm.username" placeholder="admin" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" v-model="loginForm.password" placeholder="admin" required>
                    </div>
                    <p class="login-hint">Identifiants de démonstration : admin / admin</p>
                    <p v-if="loginError" class="login-error">{{ loginError }}</p>
                    <button type="submit" class="primary-btn login-submit">Se connecter</button>
                </form>
            </div>
        </section>

        <template v-else>
            <!-- Sidebar -->
            <aside class="sidebar" :class="{ open: sidebarOpen }">
                <div class="sidebar-header">
                    <div class="logo">
                        <span>Ets Bellal Salim</span>
                    </div>
                    <button class="mobile-close" @click="sidebarOpen = false"><i class="fas fa-times"></i></button>
                </div>
                <nav class="sidebar-nav">
                    <ul>
                        <li :class="{ active: currentPage === 'dashboard' }" @click="navigate('dashboard')">
                            <a href="#"><i class="fas fa-th-large"></i> <span>Tableau de bord</span></a>
                        </li>
                        <li :class="{ active: currentPage === 'clients' }" @click="navigate('clients')">
                            <a href="#"><i class="fas fa-users"></i> <span>Clients</span></a>
                        </li>
                        <li :class="{ active: currentPage === 'contracts' }" @click="navigate('contracts')">
                            <a href="#"><i class="fas fa-file-contract"></i> <span>Contrats</span></a>
                        </li>
                        <li :class="{ active: currentPage === 'interventions' }" @click="navigate('interventions')">
                            <a href="#"><i class="fas fa-calendar-check"></i> <span>Interventions</span></a>
                        </li>
                        <li :class="{ active: currentPage === 'parametres' }" @click="navigate('parametres')">
                            <a href="#"><i class="fas fa-cog"></i> <span>Paramètres</span></a>
                        </li>

                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-info">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=2563EB&color=fff" alt="Avatar">
                        <div>
                            <p class="user-name">Admin User</p>
                            <p class="user-role">Responsable Opérations</p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-wrapper">
                <!-- Top Navigation -->
                <header class="top-nav">
                    <div class="top-nav-left">
                        <button class="mobile-toggle" @click="sidebarOpen = true"><i class="fas fa-bars"></i></button>
                        <h1>{{ pageTitle }}</h1>
                    </div>
                    <div class="top-nav-right">
                        <div class="notification-menu" @click.stop>
                            <button class="icon-btn notification-trigger" @click="toggleNotifications()">
                                <i class="far fa-bell"></i>
                                <span v-if="unreadNotificationsCount" class="notif-dot"></span>
                            </button>
                            <div v-if="notificationsOpen" class="notification-panel">
                                <div class="notification-header">
                                    <div>
                                        <h3>Notifications</h3>
                                        <p>{{ unreadNotificationsCount }} non lue(s)</p>
                                    </div>
                                    <button class="text-btn" @click="markAllNotificationsRead()"
                                        :disabled="!unreadNotificationsCount">
                                        Tout lire
                                    </button>
                                </div>
                                <div class="notification-list">
                                    <div v-for="notification in notifications" :key="notification.id"
                                        class="notification-item" :class="{ unread: !notification.read }">
                                        <div>
                                            <p class="notification-title">{{ notification.title }}</p>
                                            <p class="notification-text">{{ notification.message }}</p>
                                            <span class="notification-time">{{ notification.time }}</span>
                                        </div>
                                        <button class="text-btn" @click="markNotificationRead(notification.id)"
                                            :disabled="notification.read">
                                            {{ notification.read ? 'Lu' : 'Marquer lu' }}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button class="secondary-btn top-logout" @click="logout()">
                            Déconnexion
                        </button>
                    </div>
                </header>

                <!-- Content Area -->
                <div class="content-container">

                    <!-- Tableau de bord -->
                    <section class="page" :class="{ active: currentPage === 'dashboard' }">
                        <div class="stats-grid">
                            <div class="stat-card" v-for="stat in dashboardStats" :key="stat.label">
                                <div class="stat-icon" :class="stat.color"><i :class="stat.icon"></i></div>
                                <div class="stat-details">
                                    <p class="stat-label">{{ stat.label }}</p>
                                    <h3 class="stat-value">{{ stat.value }}</h3>
                                </div>
                            </div>
                        </div>

                        <div class="dashboard-charts">
                            <div class="chart-container card">
                                <h3>Interventions Mensuelles</h3>
                                <canvas id="interventionsChart"></canvas>
                            </div>
                            <div class="chart-container card">
                                <h3>Répartition des Contrats</h3>
                                <canvas id="statusChart"></canvas>
                            </div>
                        </div>

                        <div class="dashboard-bottom-grid">
                            <div class="card table-card">
                                <div class="card-header">
                                    <h3>Prochaines Interventions</h3>
                                    <button class="text-btn" @click="navigate('interventions')">Voir tout</button>
                                </div>
                                <div class="table-responsive">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Client</th>
                                                <th>Date</th>
                                                <th>Statut</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="i in interventions.slice(0, 4)" :key="i.id">
                                                <td>{{ i.client }}</td>
                                                <td>{{ i.date }}</td>
                                                <td><span class="badge" :class="statusClass(i.status)">{{ i.status
                                                        }}</span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="card activity-card">
                                <div class="card-header">
                                    <h3>Actions Rapides</h3>
                                </div>
                                <div class="quick-actions-list">
                                    <button class="action-item" @click="openClientModal()">
                                        <i class="fas fa-user-plus"></i> Ajouter un Client
                                    </button>
                                    <button class="action-item" @click="openContractModal()">
                                        <i class="fas fa-file-circle-plus"></i> Créer un Contrat
                                    </button>
                                    <button class="action-item" @click="openInterventionModal()">
                                        <i class="fas fa-calendar-plus"></i> Planifier une Intervention
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Clients -->
                    <section class="page" :class="{ active: currentPage === 'clients' }">
                        <div class="card">
                            <div class="table-controls">
                                <div class="search-bar">
                                    <input type="text" v-model="clientSearch"
                                        placeholder="Filtrer par société ou contact...">
                                </div>
                                <button class="primary-btn" @click="openClientModal()">
                                    <i class="fas fa-plus"></i> Ajouter un Client
                                </button>
                            </div>
                            <div class="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Société</th>
                                            <th>Contact</th>
                                            <th>Tél / Email</th>
                                            <th>Adresse</th>
                                            <th>Contrats</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="c in filteredClients" :key="c.id">
                                            <td><strong>{{ c.company }}</strong></td>
                                            <td>{{ c.contact }}</td>
                                            <td>
                                                <div style="font-size:0.85rem">{{ c.phone }}</div>
                                                <div style="font-size:0.8rem;color:var(--text-muted)">{{ c.email }}
                                                </div>
                                            </td>
                                            <td>{{ c.address }}</td>
                                            <td><span class="badge badge-active">{{ clientContractCount(c.company) }}
                                                    Actifs</span></td>
                                            <td>
                                                <button class="icon-btn" title="Modifier" @click="startEditClient(c)"><i
                                                        class="far fa-edit"></i></button>
                                                <button class="icon-btn" title="Supprimer" style="color:var(--danger)"
                                                    @click="deleteClient(c.id)">
                                                    <i class="far fa-trash-alt"></i>
                                                </button>
                                            </td>
                                        </tr>
                                        <tr v-if="filteredClients.length === 0">
                                            <td colspan="6"
                                                style="text-align:center;color:var(--text-muted);padding:32px">
                                                Aucun client trouvé.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>

                    <!-- Contrats -->
                    <section class="page" :class="{ active: currentPage === 'contracts' }">
                        <div class="card">
                            <div class="table-controls">
                                <div class="search-bar">
                                    <input type="text" v-model="contractSearch"
                                        placeholder="Rechercher des contrats...">
                                </div>
                                <button class="primary-btn" @click="openContractModal()">
                                    <i class="fas fa-plus"></i> Nouveau Contrat
                                </button>
                            </div>
                            <div class="contracts-grid">
                                <div class="contract-card card" v-for="c in filteredContracts" :key="c.id">
                                    <div style="display:flex;justify-content:space-between;align-items:start">
                                        <h4>{{ c.name }}</h4>
                                        <span class="badge" :class="statusClass(c.status)">{{ c.status }}</span>
                                    </div>
                                    <p style="color:var(--text-muted);font-size:0.85rem;margin:8px 0">{{ c.client }}</p>
                                    <div class="progress-container">
                                        <div class="progress-bar"
                                            :style="{ width: contractCompletionPercent(c) + '%' }"></div>
                                    </div>
                                    <div style="display:flex;justify-content:space-between;font-size:0.8rem">
                                        <span>{{ contractCompletedCount(c) }} / {{ contractInterventionTotal(c) }}
                                            Interventions</span>
                                        <span>{{ contractCompletionPercent(c) }}%</span>
                                    </div>
                                    <div class="contract-card-footer">
                                        <span style="font-size:0.75rem">Expire : {{ c.end }}</span>
                                        <div class="inline-actions">
                                            <button class="text-btn" @click="openContractDetails(c)">Détails</button>
                                            <button class="icon-btn" title="Modifier" @click="startEditContract(c)"><i
                                                    class="far fa-edit"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div v-if="filteredContracts.length === 0"
                                    style="padding:32px;text-align:center;color:var(--text-muted)">
                                    Aucun contrat trouvé.
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Interventions -->
                    <section class="page" :class="{ active: currentPage === 'interventions' }">
                        <div class="view-toggle card">
                            <button class="primary-btn" @click="openInterventionModal()">
                                <i class="fas fa-plus"></i> Planifier
                            </button>
                        </div>

                        <div class="card" v-show="interventionView === 'list'">
                            <div class="table-controls intervention-filters">
                                <div class="intervention-filters-fields">
                                    <div class="form-group filter-field">
                                        <label>Type</label>
                                        <select v-model="interventionFilterType">
                                            <option value="">Tous les types</option>
                                            <option v-for="option in interventionTypeOptions()" :key="option.value"
                                                :value="option.value">{{ option.label }}</option>
                                        </select>
                                    </div>
                                    <div class="form-group filter-field">
                                        <label>Du</label>
                                        <input type="date" v-model="interventionFilterStart">
                                    </div>
                                    <div class="form-group filter-field">
                                        <label>Au</label>
                                        <input type="date" v-model="interventionFilterEnd">
                                    </div>
                                </div>
                                <p class="filter-summary">
                                    {{ filteredInterventions.length }} résultat(s)
                                    <span v-if="filteredInterventions.length">
                                        — affichage {{ interventionPaginationFrom }}-{{ interventionPaginationTo }}
                                    </span>
                                </p>
                            </div>
                            <div class="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Type</th>
                                            <th>Client</th>
                                            <th>Date</th>
                                            <th>Priorité</th>
                                            <th>Statut</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="i in paginatedInterventions" :key="i.id">
                                            <td>#{{ i.id }}</td>
                                            <td>{{ interventionTypeLabel(i.type) }}</td>
                                            <td>{{ i.client }}</td>
                                            <td>{{ i.date }}</td>
                                            <td><span :style="{ color: priorityColor(i.priority) }">{{ i.priority
                                                    }}</span>
                                            </td>
                                            <td>
                                                <select class="status-select" :value="i.status"
                                                    @change="updateInterventionStatus(i.id, $event.target.value)">
                                                    <option v-for="status in interventionStatusOptions()" :key="status"
                                                        :value="status">{{ status }}</option>
                                                </select>
                                            </td>
                                            <td>
                                                <button class="icon-btn" title="Modifier"
                                                    @click="startEditIntervention(i)">
                                                    <i class="far fa-edit"></i>
                                                </button>
                                                <button class="icon-btn" title="Supprimer" style="color:var(--danger)"
                                                    @click="deleteIntervention(i.id)">
                                                    <i class="far fa-trash-alt"></i>
                                                </button>
                                            </td>
                                        </tr>
                                        <tr v-if="paginatedInterventions.length === 0">
                                            <td colspan="7"
                                                style="text-align:center;color:var(--text-muted);padding:32px">
                                                Aucune intervention pour ces filtres.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="pagination-bar" v-if="filteredInterventions.length">
                                <button type="button" class="secondary-btn" :disabled="interventionPage <= 1"
                                    @click="setInterventionPage(interventionPage - 1)">
                                    Précédent
                                </button>
                                <span class="pagination-info">Page {{ interventionPage }} / {{ interventionTotalPages }}</span>
                                <button type="button" class="secondary-btn"
                                    :disabled="interventionPage >= interventionTotalPages"
                                    @click="setInterventionPage(interventionPage + 1)">
                                    Suivant
                                </button>
                            </div>
                        </div>

                </div>
                </section>

                <section class="page" :class="{ active: currentPage === 'reports' }">
                    <div class="kpi-grid">
                        <div class="card kpi-card">
                            <p>Taux de complétion</p>
                            <h2>{{ completionRate }} %</h2>
                            <span class="trend up"><i class="fas fa-check-circle"></i> Calculé depuis les
                                interventions</span>
                        </div>
                        <div class="card kpi-card">
                            <p>Interventions ouvertes</p>
                            <h2>{{ openInterventionsCount }}</h2>
                            <span class="trend down"><i class="fas fa-stream"></i> Planifiées ou en cours</span>
                        </div>
                    </div>
                    <div class="reports-main-grid">
                        <div class="card">
                            <h3>Top Clients par Volume</h3>
                            <div v-for="client in topClientsByVolume" :key="client.company"
                                style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
                                <span>{{ client.company }}</span>
                                <strong>{{ client.volume }} Int.</strong>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Paramètres -->
                <section class="page" :class="{ active: currentPage === 'parametres' }">
                    <div class="card">
                        <div class="card-header">
                            <h3>Notifications</h3>
                        </div>
                        <div style="padding:24px">
                            <div class="form-group">
                                <label>Notifier avant l'intervention (jours)</label>
                                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                                    <input type="number" min="1" max="60" style="max-width:120px"
                                        v-model="notifDaysDraft" @keydown.enter.prevent="saveNotifSettings()">
                                    <button type="button" class="primary-btn" @click="saveNotifSettings()">
                                        Enregistrer
                                    </button>
                                </div>
                                <p style="color:var(--text-muted);font-size:0.85rem;margin-top:8px">
                                    Une notification apparaîtra automatiquement X jours avant chaque intervention
                                    planifiée ou en cours (entre 1 et 60 jours).
                                </p>
                            </div>
                        </div>
                    </div>
                </section>

    </div>
    </main>

    <!-- ===== MODALS ===== -->
    <div class="modal-overlay" :style="{ display: activeModal ? 'flex' : 'none' }" @click.self="closeModal()">

        <!-- Modal Client -->
        <div class="modal" v-show="activeModal === 'clientModal'">
            <div class="modal-header">
                <h3>{{ editingClientId ? 'Modifier le Client' : 'Ajouter un Client' }}</h3>
                <button class="close-modal" @click="closeModal()">&times;</button>
            </div>
            <form class="modal-body" @submit.prevent="submitClient()">
                <div class="form-group">
                    <label>Nom de la société</label>
                    <input type="text" v-model="clientForm.company" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Personne de contact</label>
                        <input type="text" v-model="clientForm.contact" required>
                    </div>
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="tel" v-model="clientForm.phone">
                    </div>
                </div>
                <div class="form-group">
                    <label>Adresse email</label>
                    <input type="email" v-model="clientForm.email">
                </div>
                <div class="form-group">
                    <label>Adresse</label>
                    <textarea rows="2" v-model="clientForm.address"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="secondary-btn" @click="closeModal()">Annuler</button>
                    <button type="submit" class="primary-btn">{{ editingClientId ? 'Mettre à jour' :
                        'Enregistrer' }}</button>
                </div>
            </form>
        </div>

        <!-- Modal Contrat -->
        <div class="modal modal-wide" v-show="activeModal === 'contractModal'">
            <div class="modal-header">
                <h3>{{ editingContractId ? 'Modifier le Contrat' : 'Créer un Contrat' }}</h3>
                <button class="close-modal" @click="closeModal()">&times;</button>
            </div>
            <form class="modal-body contract-form-body" @submit.prevent="submitContract()">
                <div class="form-group">
                    <label>Intitulé du contrat</label>
                    <input type="text" v-model="contractForm.name" required>
                </div>
                <div class="form-group">
                    <label>Client</label>
                    <select v-model="contractForm.client" required>
                        <option value="" disabled>Sélectionner un client</option>
                        <option v-for="c in clients" :key="c.id" :value="c.company">{{ c.company }}</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Statut</label>
                        <select v-model="contractForm.status">
                            <option>Actif</option>
                            <option>En attente</option>
                            <option>Terminé</option>
                        </select>
                    </div>
                </div>
                <div class="form-row contract-period-row">
                    <div class="form-group">
                        <label>Période du contrat — début</label>
                        <input type="date" v-model="contractForm.start" required>
                    </div>
                    <div class="form-group">
                        <label>Période du contrat — fin</label>
                        <input type="date" v-model="contractForm.end" required>
                    </div>
                </div>

                <div class="contract-planning-grid">
                    <section class="planning-column">
                        <h4 class="planning-column-title"><i class="fas fa-fire"></i> Chaudière</h4>
                        <div class="form-group">
                            <label>Nombre d'interventions prévues</label>
                            <input type="number" v-model.number="contractForm.chaudiereTotal" min="0" required>
                        </div>
                        <p class="planning-hint">Les dates seront planifiées manuellement dans le module Interventions.</p>
                    </section>

                    <section class="planning-column">
                        <h4 class="planning-column-title"><i class="fas fa-burn"></i> Brûleur</h4>
                        <div class="form-group">
                            <label>Nombre d'interventions prévues</label>
                            <input type="number" v-model.number="contractForm.bruleurTotal" min="0" required>
                        </div>
                        <p class="planning-hint">Les dates seront planifiées manuellement dans le module Interventions.</p>
                    </section>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea rows="2" v-model="contractForm.notes"
                        placeholder="Précisions sur le contrat..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="secondary-btn" @click="closeModal()">Annuler</button>
                    <button type="submit" class="primary-btn">{{ editingContractId ? 'Mettre à jour' :
                        'Enregistrer' }}</button>
                </div>
            </form>
        </div>

        <div class="modal modal-wide" v-if="activeModal === 'contractDetailModal' && selectedContract">
            <div class="modal-header">
                <div>
                    <h3>{{ selectedContract.name }}</h3>
                    <p class="modal-subtitle">{{ selectedContract.client }}</p>
                </div>
                <button class="close-modal" @click="closeModal()">&times;</button>
            </div>
            <div class="modal-body contract-detail-body">
                <div class="detail-grid">
                    <div class="detail-card">
                        <span>Statut</span>
                        <strong>{{ selectedContract.status }}</strong>
                    </div>
                    <div class="detail-card">
                        <span>Interventions prévues</span>
                        <strong>{{ contractInterventionTotal(selectedContract) }}</strong>
                    </div>
                    <div class="detail-card">
                        <span>Chaudière / Brûleur (prévu)</span>
                        <strong>{{ selectedContract.chaudiereTotal || 0 }} / {{
                            selectedContract.bruleurTotal || 0 }}</strong>
                    </div>
                    <div class="detail-card">
                        <span>Interventions terminées</span>
                        <strong>{{ contractCompletedCount(selectedContract) }} / {{
                            contractInterventionTotal(selectedContract) }}</strong>
                    </div>
                    <div class="detail-card">
                        <span>Période</span>
                        <strong>{{ selectedContract.start }} → {{ selectedContract.end }}</strong>
                    </div>
                </div>

<div class="schedule-block">
                    <div class="card-header"><h4>Planning — Chaudière</h4></div>
                    <div class="schedule-list">
                        <div class="schedule-item" v-for="item in contractInterventionsByType(selectedContract.id, 'chaudiere')" :key="item.id">
                            <div><strong>{{ item.date }}</strong><p>#{{ item.id }}</p></div>
                            <span class="badge" :class="statusClass(item.status)">{{ item.status }}</span>
                        </div>
                        <p v-if="!contractInterventionsByType(selectedContract.id, 'chaudiere').length" class="planning-hint">Aucune intervention chaudière planifiée.</p>
                    </div>
                </div>
                <div class="schedule-block">
                    <div class="card-header"><h4>Planning — Brûleur</h4></div>
                    <div class="schedule-list">
                        <div class="schedule-item" v-for="item in contractInterventionsByType(selectedContract.id, 'bruleur')" :key="item.id">
                            <div><strong>{{ item.date }}</strong><p>#{{ item.id }}</p></div>
                            <span class="badge" :class="statusClass(item.status)">{{ item.status }}</span>
                        </div>
                        <p v-if="!contractInterventionsByType(selectedContract.id, 'bruleur').length" class="planning-hint">Aucune intervention brûleur planifiée.</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="secondary-btn"
                    @click="deleteContract(selectedContract.id)">Supprimer</button>
                <button type="button" class="primary-btn" @click="startEditContract(selectedContract)">Modifier
                    le contrat</button>
            </div>
        </div>

        <!-- Modal Intervention -->
        <div class="modal" v-show="activeModal === 'interventionModal'">
            <div class="modal-header">
                <h3>{{ editingInterventionId ? 'Modifier l\'Intervention' : 'Planifier une Intervention' }}</h3>
                <button class="close-modal" @click="closeModal()">&times;</button>
            </div>
            <form class="modal-body" @submit.prevent="submitIntervention()">
                <div class="form-group">
                    <label>Client</label>
                    <select v-model="interventionForm.client"
                        :disabled="editingInterventionId && interventionForm.contractId" required>
                        <option value="" disabled>Sélectionner un client</option>
                        <option v-for="c in clients" :key="c.id" :value="c.company">{{ c.company }}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Contrat lié (optionnel)</label>
                    <select v-model="interventionForm.contractId"
                        @change="syncInterventionClientWithContract()">
                        <option value="">Aucun contrat</option>
                        <option v-for="contract in contracts" :key="contract.id" :value="contract.id">{{
                            contract.name }} — {{ contract.client }}</option>
                    </select>
                    <p v-if="editingInterventionId && interventionForm.contractId"
                        style="color:var(--text-muted);font-size:0.82rem;margin-top:8px">
                        Le client est synchronisé avec le contrat lié.
                    </p>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Type d'intervention</label>
                        <select v-model="interventionForm.type" :disabled="!interventionTypeEditable" required>
                            <option v-for="option in interventionTypeOptions()" :key="option.value"
                                :value="option.value">{{ option.label }}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" v-model="interventionForm.date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Priorité</label>
                        <select v-model="interventionForm.priority">
                            <option>Élevée</option>
                            <option>Moyenne</option>
                            <option>Faible</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Statut</label>
                        <select v-model="interventionForm.status">
                            <option v-for="status in interventionStatusOptions()" :key="status" :value="status">
                                {{ status }}</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea rows="2" v-model="interventionForm.notes"
                        placeholder="Description ou remarques..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="secondary-btn" @click="closeModal()">Annuler</button>
                    <button type="submit" class="primary-btn">{{ editingInterventionId ? 'Mettre à jour' :
                        'Planifier' }}</button>
                </div>
            </form>
        </div>

    </div><!-- /modal-overlay -->

    <!-- Toast -->
    <div class="toast" :class="{ show: toastVisible }">{{ toastMessage }}</div>

    </template>

    </div><!-- /app -->

    <script src="script.js"></script>
</body>

</html>
